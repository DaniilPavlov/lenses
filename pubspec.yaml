name: lenses
description: "Contact lenses wearing period tracker."
publish_to: "none"

version: 1.2.0+202608010

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.3.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  get_it: ^9.2.1
  home_widget: ^0.9.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  mobx: ^2.6.1
  percent_indicator: ^4.2.5
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.15.1
  dart_audit: ^0.1.0
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  meykuless_lint_rules:
    git:
      url: https://github.com/DaniilPavlov/meykuless_lint_rules.git
      ref: 3ba5652f8a54126678b8e96232d1a89f110875e9
  mobx_codegen: ^2.7.7

flutter_icons:
  android: true
  ios: true
  android_adaptive_icon_background: "#FFFFFF"
  ios_remove_alpha_icon: true
  image_path: "assets/app_icon/app_icon.png"

flutter_gen:
  output: lib/assets_gen/

  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: coolvetica
      fonts:
        - asset: assets/fonts/coolvetica_book.ttf
    - family: rfDewi
      fonts:
        - asset: assets/fonts/RFDewi-Regular.ttf
        - asset: assets/fonts/RFDewi-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/RFDewi-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/RFDewi-Semibold.ttf
          weight: 600
